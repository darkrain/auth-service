version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth_test
    ports:
      - "${AUTH_TEST_PG_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "${AUTH_TEST_REDIS_PORT:-6380}:6379"
